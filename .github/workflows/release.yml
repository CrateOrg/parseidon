name: Release

on:
  push:
    tags: [ "v*.*.*" ]

jobs:
  verify-ci:
    uses: ./.github/workflows/ci.yml

  verify-tag:
    runs-on: ubuntu-latest
    needs: verify-ci
    steps:
    - uses: actions/checkout@v6

    - name: Verify version tag matches toml
      env:
        CI_COMMIT_TAG: ${{ github.ref_name }}
      run: |
        python3 -c "import os,sys,tomllib as t;ci=os.environ['CI_COMMIT_TAG'];v=t.load(open('pyproject.toml','rb'))['project']['version'];sys.exit(ci.lstrip('v')!=v)"

  publish-docker:
    needs: verify-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
    - uses: actions/checkout@v6

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        # list of Docker images to use as base name for tags
        images: |
          ghcr.io/${{ github.repository }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and export to Docker
      uses: docker/build-push-action@v6
      with:
        target: runtime
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  build-pip-packages:
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: ./.github/actions/shared

    - name: Sync uv
      run: |
        uv sync --no-dev --frozen --no-install-project
        uv build -o dist/parseidon
        for dir in *plugin/; do
          [ -d "$dir" ] || continue
          name=$(basename "$dir")
          uv build -o "dist/plugins/$name" "$dir"
        done
      
    - name: Archive artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pip-artifacts
        path: |
          dist/parseidon
          dist/plugins

  gh-release:
    needs: [build-pip-packages, publish-docker]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v5
      with:
        name: pip-artifacts
        path: pip-artifacts
    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          pip-artifacts/parseidon/*.whl
          pip-artifacts/parseidon/*.tar.gz
          pip-artifacts/plugins/**/*.whl
          pip-artifacts/plugins/**/*.tar.gz

  pypi-publish:
    needs: [gh-release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi-publish 
      # OPTIONAL: uncomment and update to include your PyPI project URL in the deployment status:
      # url: https://pypi.org/p/YOURPROJECT
      #
      # ALTERNATIVE: if your GitHub Release name is the PyPI project version string
      # ALTERNATIVE: exactly, uncomment the following line instead:
      # url: https://pypi.org/project/YOURPROJECT/${{ github.event.release.name }}
    strategy:
      matrix:
        pkg:
          - pip-artifacts/parseidon
          - pip-artifacts/plugins/parseidon_headings_plugin
          - pip-artifacts/plugins/parseidon_hyphen_plugin
    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v5
        with:
          name: pip-artifacts
          path: pip-artifacts

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
          skip-existing: true
          packages-dir: ${{ matrix.pkg }}