[project]
name = "parseidon_hyphen_plugin"
version = "1.5"
authors = [
    { name="William de Brun Mangs", email="william.de.brun.mangs@foi.se" },
    { name="Adrian Rosén", email="adrian.rosen@foi.se" },
]
description = "Plugin for handling hyphens in compound words for parseidon"
requires-python = ">=3.9"
dependencies = ["parseidon>=2.2.6"]

[project.entry-points."parseidon.plugins"]
hyphen_plugin = "parseidon_hyphen_plugin.dehyphenate:DehyphenatePlugin"

[build-system]
requires = ["setuptools", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
