[project]
name = "parseidon-hyphen-plugin"
version = "1.5"
license = { text = "MIT" }
authors = [
    { name="Parseidon Dev Team", email="parseidon@foi.se" },
]
description = "Plugin for handling hyphens in compound words for parseidon"
requires-python = ">=3.9"
dependencies = ["parseidon>=2.2.6"]

[project.urls]
Homepage = "https://github.com/CrateOrg/parseidon"
Repository = "https://github.com/CrateOrg/parseidon"

[project.entry-points."parseidon.plugins"]
hyphen_plugin = "parseidon_hyphen_plugin.dehyphenate:DehyphenatePlugin"

[build-system]
requires = ["setuptools", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
