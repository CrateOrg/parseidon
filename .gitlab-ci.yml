stages:
  - validate
  - build-docker-base
  - test
  - build
  - publish

.semantic_version_only: &semantic_version_only
  if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

.uv_cache:
  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/.uv-cache"
  after_script:
    - uv cache prune --ci
  cache:
    key:
      files:
        - uv.lock
    paths:
      - $UV_CACHE_DIR

variables:
  DOCKER_IMAGE_CLI_VERSION: "29-cli"
  DOCKER_IMAGE_DIND_VERSION: "29-dind"
  PYTHON_VERSION: "3.12"
  UV_IMAGE: "ghcr.io/astral-sh/uv:python3.12-alpine"
  UV_LINK_MODE: copy
  RUFF_IMAGE_VERSION: "0.14.10-alpine"

# ---------- VALIDATE ----------
validate_version:
  stage: validate
  image: python:$PYTHON_VERSION
  rules:
    - <<: *semantic_version_only
  script:
    - python ci/check_version.py

# ---------- DOCKER BASE STAGE ----------
build-base-docker-image:
  stage: build-docker-base
  image: docker:$DOCKER_IMAGE_CLI_VERSION
  services:
    - docker:$DOCKER_IMAGE_DIND_VERSION
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: 
      - Dockerfile
  variables:
    IMAGE_NAME: $CI_REGISTRY_IMAGE
    IMAGE_TAG: 'base'
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker build --target base -t "$IMAGE_NAME:$IMAGE_TAG" .
    - docker push "$IMAGE_NAME:$IMAGE_TAG"
    - docker logout "$CI_REGISTRY"

# ---------- TEST STAGE ----------
pip-audit:
  stage: test
  image: $UV_IMAGE
  script:
    - uv sync --dev --frozen
    - uv run pip-audit .

ruff-check:
  stage: test
  image: ghcr.io/astral-sh/ruff:$RUFF_IMAGE_VERSION
  script:
    - ruff check --exclude=tests --output-format=gitlab --output-file=code-quality-report.json
  artifacts:
    reports:
        codequality: code-quality-report.json

test-source:
  stage: test
  image: $CI_REGISTRY_IMAGE:base
  extends: .uv_cache
  before_script:
    - uv sync --dev --frozen
  script:
    - uv run pytest -vv --junitxml=report.xml --cov=src --cov-report term --cov-report xml:coverage.xml
  coverage: '/TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit: report.xml

# ---------- BUILD STAGE ----------
build-package:
  stage: build
  image: $UV_IMAGE
  extends:
    - .uv_cache
  rules:
    - <<: *semantic_version_only
  before_script:
    - uv sync --no-dev --frozen --no-install-project
  script:
    - uv build -o dist/parseidon
    - |
      for dir in *plugin/; do
        [ -d "$dir" ] || continue
        name=$(basename "$dir")
        uv build -o "dist/plugins/$name" "$dir"
      done
  artifacts:
    name: "pip-package-$CI_COMMIT_REF_NAME"
    paths:
      - dist/parseidon/*.whl
      - dist/parseidon/*.tar.gz
      - dist/plugins/**/*.whl
      - dist/plugins/**/*.tar.gz

# ---------- PUBLISH STAGE ----------
publish-pip:
  image: python:$PYTHON_VERSION
  stage: publish
  needs: 
    - job: build-package
      artifacts: true
  rules:
    - <<: *semantic_version_only
      changes:
        - dist/parseidon/*
  variables:
    TWINE_USERNAME: gitlab-ci-token
    TWINE_PASSWORD: $CI_JOB_TOKEN
  script:
    - pip install twine
    - twine upload --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi dist/parseidon/*

# Marginally better solution than before...
publish-plugins-pip:
  image: python:$PYTHON_VERSION
  stage: publish
  needs: 
    - job: build-package
      artifacts: true
  rules:
    - <<: *semantic_version_only
      changes:
        - dist/parseidon/*
  variables:
    TWINE_USERNAME: gitlab-ci-token
    TWINE_PASSWORD: $CI_JOB_TOKEN
  script:
    - pip install twine
    - |
      for plugin_dir in dist/plugins/*; do
        [ -d "$plugin_dir" ] || continue
        twine upload --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi "${plugin_dir}/*" || true
      done

publish-docker:
  stage: publish
  image: docker:$DOCKER_IMAGE_CLI_VERSION
  rules:
    - <<: *semantic_version_only
  services:
    - docker:$DOCKER_IMAGE_DIND_VERSION
  variables:
    IMAGE_NAME: $CI_REGISTRY_IMAGE
    IMAGE_TAG: $CI_COMMIT_TAG
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker pull "$CI_REGISTRY_IMAGE:base" || true
    - docker build --target runtime --cache-from "$CI_REGISTRY_IMAGE:base" -t "$IMAGE_NAME:$IMAGE_TAG" -t "$IMAGE_NAME:latest" .
    - docker push "$IMAGE_NAME:$IMAGE_TAG"
    - docker push "$IMAGE_NAME:latest"
    - docker logout "$CI_REGISTRY"

