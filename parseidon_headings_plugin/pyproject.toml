[project]
name = "parseidon-headings-plugin"
version = "1.2"
license = { text = "MIT" }
authors = [
    { name="Parseidon Dev Team", email="parseidon@foi.se" },
]
description = "Plugin removing IPv4-like headings in documents for parseidon"
requires-python = ">=3.9"
dependencies = ["parseidon>=2.2.6"]

[project.urls]
Homepage = "https://github.com/CrateOrg/parseidon"
Repository = "https://github.com/CrateOrg/parseidon"

[project.entry-points."parseidon.plugins"]
headings_plugin = "parseidon_headings_plugin.remove_headings:RemoveHeadingPlugin"

[build-system]
requires = ["setuptools", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
